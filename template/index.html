<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#203e39">
  <meta name="description" content="Living Project Atlas — an interactive project workspace template.">
  <title>Living Project Atlas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <aside class="rail" id="rail" aria-label="Project contents"></aside>
  <div class="workspace">
    <header class="topbar">
      <button id="menu" class="icon-button" aria-label="Open contents" aria-controls="rail" aria-expanded="false">☰</button>
      <nav id="breadcrumbs" aria-label="Breadcrumb"></nav>
      <span class="topbar-right"><span class="connection-dot"></span> Template preview <span class="separator">/</span> <span class="director-avatar">D</span> Director</span>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer"><span>Living Project Atlas <span class="muted">/</span> Template v1.0.1</span><span>Example data · Execution not connected</span></footer>
  </div>
  <dialog id="action-dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>This interactive template requires JavaScript. Read the project documentation for the specification.</noscript>
</body>
</html>
